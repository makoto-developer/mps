# coturn TURN Server Configuration for Drawing App P2P

# Network settings
listening-port=22304
tls-listening-port=22304
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# External IP - Set this to your public IP in production
# external-ip=YOUR_PUBLIC_IP

# TURN server realm
realm=drawingapp.local

# Authentication
# Use long-term credentials mechanism
lt-cred-mech

# Static users for development
# In production, use a database or dynamic secrets
user=drawingapp:drawing_turn_secret_2024

# Shared secret for TURN REST API
# use-auth-secret
# static-auth-secret=your_static_secret_here

# Logging
log-file=/var/log/turnserver/turnserver.log
verbose

# Security settings
no-multicast-peers
no-cli

# Fingerprint for STUN message validation
fingerprint

# Limit relay threads (adjust based on server capacity)
relay-threads=4

# Limit allocations per user
total-quota=100
user-quota=10

# Stale nonce - lifetime in seconds
stale-nonce=600

# Max bandwidth for each allocation (in bytes per second)
# max-bps=0 means no limit
max-bps=0

# Certificate and key for TLS (optional)
# cert=/etc/turnserver/turn_server_cert.pem
# pkey=/etc/turnserver/turn_server_pkey.pem

# Allowed peer IP ranges
# allowed-peer-ip=10.0.0.0-10.255.255.255
# allowed-peer-ip=172.16.0.0-172.31.255.255
# allowed-peer-ip=192.168.0.0-192.168.255.255

# Denied peer IP ranges (prevent relaying to localhost/private)
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1

# Prometheus metrics (if enabled)
# prometheus
# prometheus-port=9641
