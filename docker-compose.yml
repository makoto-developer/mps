services:
  # Phoenix Signaling Server for WebRTC (port 22303)
  phoenix:
    build:
      context: ./phoenix
      dockerfile: Dockerfile
    container_name: drawing-app-signaling
    environment:
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_PORT: 22303
      PHX_SECRET_KEY_BASE: ${PHX_SECRET_KEY_BASE:-dev_secret_key_base_min_64_bytes_long_for_development_purposes_only_change_in_prod}
    ports:
      - "22303:22303"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:22303/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # coturn TURN Server for NAT traversal (port 22304)
  coturn:
    image: coturn/coturn:4.6
    container_name: drawing-app-turn
    ports:
      - "22304:22304/udp"
      - "22304:22304/tcp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./logs/turn:/var/log/turnserver
    command: ["-c", "/etc/coturn/turnserver.conf"]
    restart: unless-stopped
    profiles:
      - turn

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: drawing-app-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drawingapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drawingapp_password}
      POSTGRES_DB: ${POSTGRES_DB:-drawingapp}
    ports:
      - "22302:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drawingapp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Generated Application (port 22301) - optional, requires 'make generate' first
  app:
    build:
      context: ./generated
      dockerfile: ../Dockerfile.app
    container_name: drawing-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-drawingapp}:${POSTGRES_PASSWORD:-drawingapp_password}@postgres:5432/${POSTGRES_DB:-drawingapp}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      PORT: 22301
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "22301:22301"
    volumes:
      - ./generated:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate deploy && npm start"
    profiles:
      - generated

  # PGAdmin (optional, port 22305)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: drawing-app-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "22305:80"
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:
